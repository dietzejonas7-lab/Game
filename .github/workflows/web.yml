# Prüft den Code und veröffentlicht das Spiel + die Inhalte auf GitHub Pages.
# Danach holt sich die App auf jedem Handy automatisch die neuen Inhalte.
name: Web & Inhalte

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Inhalte prüfen (content.json)
        run: npm run check:content
      - name: Bauen
        run: npm run build
      - if: github.ref_name == github.event.repository.default_branch && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Veröffentlicht nur vom Haupt-Branch aus
  deploy:
    if: github.ref_name == github.event.repository.default_branch && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
